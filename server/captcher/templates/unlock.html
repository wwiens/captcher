<!DOCTYPE html>
<html lang="en"><head><title>Unlock — Captcher</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAFAF9">
<link rel="icon" type="image/svg+xml" href="/static/logo.svg"><link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png"><link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16.png"><link rel="apple-touch-icon" sizes="180x180" href="/static/favicon-180.png">
<!-- font-preload: the two faces this page paints — DM Sans for the form,
     Outfit Black for the heading. -->
<link rel="preload" href="/static/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/outfit-latin-900.woff2" as="font" type="font/woff2" crossorigin>
<!-- /font-preload -->
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="stylesheet" href="/static/captcher.css">
<link rel="stylesheet" href="/static/auth-simple.css">
</head><body class="auth auth-simple">
<!-- Shown only when the server was started with CAPTCHER_ACCESS_TOKEN, which
     it requires whenever it listens beyond this machine. Bound to loopback,
     there is no such page: the browser is the owner. -->
<div class="auth-layout">
<div class="auth-side">
  <header class="auth-top">
    <span class="brand-lockup">__LOGO__<span class="brand-word">Captcher</span></span>
  </header>
  <main class="auth-main">
    <form class="auth-card" method="POST" action="/unlock">
      <h1>Unlock</h1>
      <p class="auth-intro">This Captcher server is shared on a network. Enter the
        access token it was started with.</p>
      __ERROR__
      <div class="field">
        <label class="field-label" for="token">Access token</label>
        <input class="input" id="token" name="token" type="password"
               autocomplete="current-password" required autofocus>
      </div>
      <button class="button button--primary button--lg button--block" type="submit">Unlock</button>
    </form>
  </main>
</div>
</div>
</body></html>
